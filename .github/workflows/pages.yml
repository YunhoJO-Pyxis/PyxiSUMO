name: 웹페이지 공개

# DB를 읽어 정적 사이트를 만들고 GitHub Pages 로 올린다.
# 저장소 Settings → Pages → Source 를 "GitHub Actions" 로 바꿔두어야 한다.
#
# 실패했을 때 무엇이 잘못됐는지는 **Annotations 상자**에 적는다 (::error::).
# 로그 전체는 로그인해야 보이지만 Annotations 는 로그인 없이도 보이기 때문이다.
on:
  push:
    # 코드를 올리면 그때마다 다시 만든다.
    # (A_깃허브에올리기.bat 만 실행하면 되고 버튼을 찾을 필요가 없다)
    branches: [main]
  schedule:
    - cron: "30 21 * * *"   # UTC 21:30 = JST 익일 06:30
  workflow_dispatch:
  workflow_run:
    workflows: ["장중 성적 갱신", "반즈케 예측 / 적중률"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      # 접속 정보와 데이터부터 확인한다. 여기서 걸러내지 않으면 뒤 단계가
      # 알 수 없는 이유로 죽고, 로그를 못 보는 사람은 원인을 짐작할 수 없다.
      # 안내문은 Annotations 상자에 찍힌다 (로그인 없이도 보인다).
      - name: 접속 정보와 데이터 확인
        run: python tools/preflight.py

      - name: 한국어·일본어 표기 채우기
        # 이 단계를 빼면 공개된 사이트에 'Nishonoseki' 같은 영문이 그대로 나간다.
        # (이미 값이 있는 행은 건드리지 않으므로 매번 돌려도 안전하다)
        run: |
          python -m pyxisumo.setup names || {
            echo "::error title=이름 표기를 채우지 못했습니다::DB 접속은 됐지만 표기 채우기에서 멈췄습니다. 이 화면을 알려 주세요."
            exit 1
          }

      - name: 사이트 생성
        run: |
          python -m pyxisumo.site.build --out docs || {
            echo "::error title=웹페이지를 만들지 못했습니다::DB는 읽었지만 페이지 생성에서 멈췄습니다. 이 화면을 알려 주세요."
            exit 1
          }

      - name: 생성 결과 점검
        run: |
          python tests/check_site.py --dir docs || {
            echo "::error title=만들어진 페이지에 문제가 있습니다::링크·표기 점검에서 걸렸습니다. 이 화면을 알려 주세요."
            exit 1
          }

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
