name: 테스트

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pyxisumo
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGPASSWORD: postgres
      TEST_DSN: postgresql://postgres:postgres@localhost:5432/pyxisumo

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 마이그레이션 적용
        run: DATABASE_URL="$TEST_DSN" python -m pyxisumo.migrate up

      - name: 마이그레이션 재실행 안전성
        run: DATABASE_URL="$TEST_DSN" python -m pyxisumo.migrate up

      - name: 순수 로직 테스트
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: rank_value — Python/Postgres 일치 검증
        run: PSQL='psql "'"$TEST_DSN"'"' python tests/test_rank_value_parity.py

      - name: upsert SQL PREPARE 검증
        run: PSQL='psql "'"$TEST_DSN"'"' python tests/check_sql.py

      - name: 예측 조회 SQL 검증
        run: PSQL='psql "'"$TEST_DSN"'"' python tests/check_predict_sql.py

      - name: 체크포인트 재개 로직 검증
        run: DATABASE_URL="$TEST_DSN" python tests/check_checkpoint.py

      - name: 적재 전 과정 검증 (네트워크 없이)
        run: DATABASE_URL="$TEST_DSN" python tests/check_bootstrap.py

      - name: 필드맵 학습 실패 시나리오 검증
        run: DATABASE_URL="$TEST_DSN" python tests/check_setup_flow.py

      - name: 실제 API 응답 모양 전 과정 검증
        run: DATABASE_URL="$TEST_DSN" python tests/check_realistic_api.py

      - name: 예측 정확도 개선 측정
        run: python tests/check_tuning.py

      - name: 표기 채우기 검증
        run: DATABASE_URL="$TEST_DSN" python tests/check_names.py

      - name: 표기 채우기 — 실제 규모 (DB 왕복 횟수)
        run: DATABASE_URL="$TEST_DSN" python tests/check_names_scale.py

      - name: 사이트 생성 및 점검
        run: |
          DATABASE_URL="$TEST_DSN" python tests/seed_demo.py
          DATABASE_URL="$TEST_DSN" python -m pyxisumo.setup names
          DATABASE_URL="$TEST_DSN" python tests/check_queries.py
          DATABASE_URL="$TEST_DSN" python -m pyxisumo.site.build --out /tmp/site
          python tests/check_site.py --dir /tmp/site

      - name: 반즈케 내용이 실제와 맞는지 검증
        run: python tests/check_banzuke_truth.py --dir /tmp/site

      - name: 예측 페이지 (발표됨 / 발표 전)
        run: DATABASE_URL="$TEST_DSN" python tests/check_yosou.py

      - name: 새 버전 적용이 데이터를 건드리지 않는지
        run: DATABASE_URL="$TEST_DSN" python tests/check_update.py

      - name: 올리기 안전장치 (비밀번호 유출 차단)
        run: python tests/check_publish.py

      - name: setup doctor
        run: DATABASE_URL="$TEST_DSN" python -m pyxisumo.setup doctor || true
