name: 반즈케 예측 / 적중률

# 타이밍 (설계서 五장)
#   센슈라쿠 다음날      → 예측 생성. 발표까지 약 4주간 사이트에 게시된다.
#   반즈케 발표일        → 실제 반즈케 수집 후 적중률 계산.
# 두 시점 모두 "매일 한 번 돌면서 오늘이 그날인지 DB에 묻는" 방식으로 처리한다.
on:
  schedule:
    - cron: "0 22 * * *"   # UTC 22:00 = JST 익일 07:00
  workflow_dispatch:
    inputs:
      source:
        description: "근거 바쇼 (YYYYMM)"
        required: false
      target:
        description: "예측 대상 바쇼 (YYYYMM)"
        required: false
      evaluate:
        description: "적중률만 계산 (true/false)"
        required: false
        default: "false"

concurrency:
  group: predict

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: 오늘 할 일 판정
        id: plan
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os, psycopg
          src = (os.environ.get("IN_SOURCE") or "").strip()
          tgt = (os.environ.get("IN_TARGET") or "").strip()
          force_eval = (os.environ.get("IN_EVAL") or "").lower() == "true"

          with psycopg.connect(os.environ["DATABASE_URL"]) as c, c.cursor() as cur:
              # 어제 끝난 바쇼가 있으면 → 예측
              cur.execute("SELECT id FROM basho WHERE end_date = CURRENT_DATE - 1")
              just_ended = cur.fetchone()
              # 오늘이 반즈케 발표일이면 → 적중률
              cur.execute("SELECT id FROM basho WHERE banzuke_released_on = CURRENT_DATE")
              released = cur.fetchone()

          if force_eval and tgt:
              print(f"action=evaluate"); print(f"target={tgt}")
          elif src:
              print("action=predict"); print(f"source={src}")
              if tgt: print(f"target={tgt}")
          elif released:
              print("action=evaluate"); print(f"target={released[0]}")
          elif just_ended:
              print("action=predict"); print(f"source={just_ended[0]}")
          else:
              print("action=none")
          PY
        env:
          IN_SOURCE: ${{ github.event.inputs.source }}
          IN_TARGET: ${{ github.event.inputs.target }}
          IN_EVAL: ${{ github.event.inputs.evaluate }}

      - name: 예측 생성
        if: steps.plan.outputs.action == 'predict'
        run: |
          python -m pyxisumo.run_predict predict \
            --source "${{ steps.plan.outputs.source }}" \
            ${{ steps.plan.outputs.target && format('--target {0}', steps.plan.outputs.target) || '' }}

      - name: 실제 반즈케 수집 후 적중률 계산
        if: steps.plan.outputs.action == 'evaluate'
        run: |
          python -m pyxisumo.ingest basho --basho "${{ steps.plan.outputs.target }}"
          python -m pyxisumo.run_predict evaluate --target "${{ steps.plan.outputs.target }}"

      - name: 해당 없음
        if: steps.plan.outputs.action == 'none'
        run: echo "오늘은 예측/평가 대상일이 아닙니다."
