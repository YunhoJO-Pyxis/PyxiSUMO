name: 초기설정 / 점검

# 초기 적재는 오래 걸리므로(무료 API 예의상 요청 간격 0.6초) 수동 실행으로 둔다.
# 체크포인트 기반이라 6시간 제한에 걸려 죽어도 다시 돌리면 이어받는다.
on:
  workflow_dispatch:
    inputs:
      command:
        description: "실행할 명령"
        required: true
        default: "doctor"
        type: choice
        options: [doctor, init, resume, retry-failed]
      from:
        description: "적재 시작 바쇼 (YYYYMM). 전량은 195801"
        required: false
        default: "201801"
      to:
        description: "적재 종료 바쇼 (YYYYMM)"
        required: false
        default: "202609"
      with_makushita:
        description: "마쿠시타까지 수집"
        type: boolean
        default: false
  schedule:
    - cron: "0 21 * * 1"   # 매주 월요일 JST 06:00 — 상태 점검만

concurrency:
  group: setup
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: 실행
        run: |
          CMD="${{ github.event.inputs.command || 'doctor' }}"
          ARGS=""
          if [ "$CMD" != "doctor" ]; then
            ARGS="--from ${{ github.event.inputs.from || '201801' }} --to ${{ github.event.inputs.to || '202609' }}"
            if [ "${{ github.event.inputs.with_makushita }}" = "true" ]; then
              ARGS="$ARGS --with-makushita"
            fi
          fi
          python -m pyxisumo.setup "$CMD" $ARGS

      - name: 중단 시 이어받는 법 안내
        if: failure()
        run: |
          echo "::notice::적재가 중단되었습니다. 이 워크플로를 command=resume 으로 다시 실행하면"
          echo "::notice::끝난 바쇼는 건너뛰고 남은 것부터 이어받습니다."
